<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>video render</title><meta name="robots" content="noindex"></head>
<body style="margin:0">
<script type="module">
  // Headless target for tools/produce_video.py: the same motion engine the Video Studio previews.
  import { loadBrand } from './js/brand.js';
  import { MotionRenderer, timeline } from './js/motion.js';
  const q = new URLSearchParams(location.search);
  try {
    const brand = await loadBrand('..');
    const tracks = await fetch('../assets/music/tracks.json').then(r => r.json());
    const spec = await fetch(q.get('spec')).then(r => r.json());
    const tl = timeline(spec, tracks);
    // one <video> per scene group (continuous scenes share their group's element)
    const els = {};
    for (const sc of tl.scenes) {
      if (!sc.clip || sc.continuous) continue;
      const v = document.createElement('video');
      v.muted = true; v.preload = 'auto'; v.playsInline = true;
      v.src = `../assets/video/${sc.clip.name}.webm`;
      await new Promise((res, rej) => { v.addEventListener('loadeddata', res, { once: true }); v.addEventListener('error', () => rej(new Error(`Could not load ${sc.clip.name}`)), { once: true }); });
      els[sc.index] = v;
    }
    const mr = await new MotionRenderer(brand, spec, tracks, { video: i => els[i] || null }).prepare();
    const out = document.createElement('canvas');
    const checks = await mr.check();
    window.__video = {
      spec, fps: mr.fps, total: Math.round(mr.tl.total * mr.fps), seconds: mr.tl.total, bpm: mr.tl.bpm,
      music: mr.tl.music ? mr.tl.music.file : null,
      async frame(i) { await mr.frameAt((i + 0.5) / mr.fps, out); return out.toDataURL('image/jpeg', 0.93); },
      async held() {
        const outs = [];
        for (const [k, sc] of mr.tl.scenes.entries()) {
          const c = document.createElement('canvas');
          await mr.heldFrame(sc, c);
          outs.push({ name: `scene-${String(k + 1).padStart(2, '0')}`, png: c.toDataURL('image/png'), report: checks.scenes[k] });
        }
        return outs;
      },
      copy: checks.copy,
    };
  } catch (e) { window.__video = { error: String(e.stack || e) }; }
</script></body></html>
