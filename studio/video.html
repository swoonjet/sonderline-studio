<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>video render</title><meta name="robots" content="noindex"></head>
<body style="margin:0">
<script type="module">
  // Headless target for tools/produce_video.py: the same motion engine the Video Studio previews.
  import { loadBrand } from './js/brand.js';
  import { MotionRenderer, timeline } from './js/motion.js';
  const q = new URLSearchParams(location.search);
  try {
    const brand = await loadBrand('..');
    const tracks = await fetch('../assets/music/tracks.json').then(r => r.json());
    const spec = await fetch(q.get('spec')).then(r => r.json());
    const tl = timeline(spec, tracks);
    // masters (?frames=1): footage comes from image sequences extracted by tools/produce_video.py
    const useFrames = !!q.get('frames');
    const cache = new Map();
    const frameImage = (name, t) => {
      const i = Math.max(1, Math.round(t * 24) + 1);
      const key = `${name}/${i}`;
      if (!cache.has(key)) {
        if (cache.size > 96) cache.delete(cache.keys().next().value);
        cache.set(key, new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error(`Missing frame ${key}`)); im.src = `../assets/video/frames/${name}/${String(i).padStart(4, '0')}.jpg`; }));
      }
      return cache.get(key);
    };
    // one <video> per scene group (continuous scenes share their group's element)
    const els = {};
    for (const sc of tl.scenes) {
      if (useFrames || !sc.clip || sc.continuous) continue;
      const v = document.createElement('video');
      v.muted = true; v.preload = 'auto'; v.playsInline = true;
      // masters render from near-lossless footage (assets/video/hq, made locally from the raw clips)
      v.src = `../assets/video/${q.get('hq') ? 'hq/' : ''}${sc.clip.name}.webm`;
      await new Promise((res, rej) => { v.addEventListener('loadeddata', res, { once: true }); v.addEventListener('error', () => rej(new Error(`Could not load ${sc.clip.name}`)), { once: true }); });
      els[sc.index] = v;
    }
    const mr = await new MotionRenderer(brand, spec, tracks, useFrames ? { frames: frameImage } : { video: i => els[i] || null }).prepare();
    const out = document.createElement('canvas');
    const checks = await mr.check();
    window.__video = {
      spec, fps: mr.fps, total: Math.round(mr.tl.total * mr.fps), seconds: mr.tl.total, bpm: mr.tl.bpm,
      music: mr.tl.music ? mr.tl.music.file : null,
      async frame(i) { await mr.frameAt((i + 0.5) / mr.fps, out); return out.toDataURL('image/png'); },   // lossless into the encoder
      async held() {
        const outs = [];
        for (const [k, sc] of mr.tl.scenes.entries()) {
          const c = document.createElement('canvas');
          await mr.heldFrame(sc, c);
          outs.push({ name: `scene-${String(k + 1).padStart(2, '0')}`, png: c.toDataURL('image/png'), report: checks.scenes[k] });
        }
        return outs;
      },
      copy: checks.copy,
    };
  } catch (e) { window.__video = { error: String(e.stack || e) }; }
</script></body></html>
