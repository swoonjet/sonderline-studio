<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>video render</title><meta name="robots" content="noindex"></head>
<body style="margin:0">
<script type="module">
  // Headless target for tools/produce_video.py: the same motion engine the Video Studio previews.
  import { loadBrand } from './js/brand.js';
  import { MotionRenderer } from './js/motion.js';
  const q = new URLSearchParams(location.search);
  try {
    const brand = await loadBrand('..');
    const tracks = await fetch('../assets/music/tracks.json').then(r => r.json());
    const spec = await fetch(q.get('spec')).then(r => r.json());
    const fps = spec.fps || 30;
    const mr = new MotionRenderer(brand, spec, tracks).prepare();
    const out = document.createElement('canvas');
    const checks = mr.check();
    window.__video = {
      spec, fps, total: Math.round(mr.tl.total * fps), seconds: mr.tl.total, bpm: mr.tl.bpm,
      music: spec.music && tracks[spec.music] ? tracks[spec.music].file : null,
      frame(i) { mr.frameAt(i / fps, out); return out.toDataURL('image/jpeg', 0.94); },
      held() {
        return mr.tl.scenes.map((sc, k) => {
          const c = document.createElement('canvas');
          mr.heldFrame(sc, c);
          return { name: `scene-${String(k + 1).padStart(2, '0')}`, png: c.toDataURL('image/png'), report: checks.scenes[k] };
        });
      },
      copy: checks.copy,
    };
  } catch (e) { window.__video = { error: String(e.stack || e) }; }
</script></body></html>
